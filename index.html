urceUrl":"https://www.asahidia.co.jp/en/products/product14/","id":"w48"}],"formulas":[{"cat":"Geschwindigkeit","name":"Scheibengeschwindigkeit","formula":"v_c = π · D_s · n_s / 60 000","symbol":"v_c","meaning":"Umfangsgeschwindigkeit der Schleifscheibe","unit":"m/s","notes":"D_s in mm, n_s in 1/min","example":"D_s=300 mm, n_s=1082 1/min -> v_c≈17,0 m/s","id":"f0"},{"cat":"Geschwindigkeit","name":"Scheibendrehzahl","formula":"n_s = 60 000 · v_c / (π · D_s)","symbol":"n_s","meaning":"Drehzahl der Schleifscheibe","unit":"1/min","notes":"v_c in m/s, D_s in mm","example":"v_c=17 m/s, D_s=300 mm -> n_s≈1082 1/min","id":"f1"},{"cat":"Geschwindigkeit","name":"Werkstückumfangsgeschwindigkeit","formula":"v_w = π · d_w · n_w / 1000","symbol":"v_w","meaning":"Umfangsgeschwindigkeit des Werkstücks","unit":"m/min","notes":"d_w in mm, n_w in 1/min","example":"d_w=100 mm, n_w=100 1/min -> 31,4 m/min","id":"f2"},{"cat":"Geschwindigkeit","name":"Geschwindigkeitsverhältnis","formula":"q_s = 60 · v_c / v_w","symbol":"q_s","meaning":"Verhältnis Scheibengeschwindigkeit zu Werkstückgeschwindigkeit","unit":"-","notes":"v_c in m/s, v_w in m/min","example":"v_c=20 m/s, v_w=15 m/min -> q_s=80","id":"f3"},{"cat":"Geschwindigkeit","name":"Abrichtverhältnis","formula":"q_d = v_R / v_c","symbol":"q_d","meaning":"Geschwindigkeitsverhältnis Abrichtrolle zu Schleifscheibe","unit":"-","notes":"Betrag plus Drehrichtung beachten","example":"v_R=12 m/s, v_c=20 m/s -> q_d=0,60","id":"f4"},{"cat":"Abtrag","name":"Spezifische Abtragsrate Flachschleifen","formula":"Q′_w = a_e · v_w · 1000 / 60","symbol":"Q′_w","meaning":"Spezifische Abtragsrate","unit":"mm³/(mm·s)","notes":"a_e in mm, v_w in m/min","example":"a_e=0,02 mm, v_w=15 m/min -> 5,0","id":"f5"},{"cat":"Abtrag","name":"Gesamtabtragsrate","formula":"Q_w = Q′_w · b","symbol":"Q_w","meaning":"Volumenabtrag pro Zeit","unit":"mm³/s","notes":"b = aktive Schleifbreite in mm","example":"Q′_w=5, b=20 -> 100 mm³/s","id":"f6"},{"cat":"Abtrag","name":"Äquivalente Spanungsdicke","formula":"h_eq = Q′_w / (1000 · v_c)","symbol":"h_eq","meaning":"Äquivalente Spanungsdicke","unit":"mm","notes":"v_c in m/s","example":"Q′_w=5, v_c=20 -> 0,00025 mm","id":"f7"},{"cat":"Kontakt","name":"Geometrische Kontaktlänge Flachschleifen","formula":"l_g ≈ √(D_s · a_e)","symbol":"l_g","meaning":"Geometrische Kontaktlänge","unit":"mm","notes":"D_s und a_e in mm","example":"D_s=300, a_e=0,02 -> 2,45 mm","id":"f8"},{"cat":"Kontakt","name":"Kontaktfläche","formula":"A_k ≈ b · l_g","symbol":"A_k","meaning":"Näherungsweise Kontaktfläche","unit":"mm²","notes":"b und l_g in mm","example":"b=20, l_g=2,45 -> 49 mm²","id":"f9"},{"cat":"KSS & Düse","name":"Runddüsenfläche","formula":"A = π · d² / 4","symbol":"A","meaning":"Freie Querschnittsfläche einer Runddüse","unit":"mm²","notes":"d = Innendurchmesser","example":"d=8 mm -> 50,27 mm²","id":"f10"},{"cat":"KSS & Düse","name":"Rechteckdüsenfläche","formula":"A = b_D · h_D","symbol":"A","meaning":"Freie Querschnittsfläche einer Flachdüse","unit":"mm²","notes":"b_D und h_D in mm","example":"8×2 mm -> 16 mm²","id":"f11"},{"cat":"KSS & Düse","name":"Volumenstrom aus Geschwindigkeit","formula":"Q = 0,06 · A · v_KSS","symbol":"Q","meaning":"Volumenstrom","unit":"l/min","notes":"A in mm², v_KSS in m/s","example":"A=50,27, v=17 -> 51,27 l/min","id":"f12"},{"cat":"KSS & Düse","name":"Austrittsgeschwindigkeit","formula":"v_KSS = Q / (0,06 · A)","symbol":"v_KSS","meaning":"KSS-Austrittsgeschwindigkeit","unit":"m/s","notes":"Q in l/min, A in mm²","example":"Q=51,27, A=50,27 -> 17,0 m/s","id":"f13"},{"cat":"KSS & Düse","name":"Volumenstrom aus Liter und Zeit","formula":"Q = V · 60 / t","symbol":"Q","meaning":"Volumenstrom","unit":"l/min","notes":"V in Liter, t in Sekunden","example":"8,55 l in 10 s -> 51,3 l/min","id":"f14"},{"cat":"KSS & Düse","name":"Volumenstrom aus Gewicht","formula":"Q = m · 60 / (ρ · t)","symbol":"Q","meaning":"Volumenstrom aus Wägung","unit":"l/min","notes":"m in kg, ρ in kg/l, t in s","example":"6,84 kg, ρ=0,8, t=10 s -> 51,3 l/min","id":"f15"},{"cat":"KSS & Düse","name":"Geschwindigkeit aus Druck","formula":"v_KSS = C_d · √(2 · Δp / ρ)","symbol":"v_KSS","meaning":"Austrittsgeschwindigkeit aus Druckdifferenz","unit":"m/s","notes":"Δp in Pa, ρ in kg/m³","example":"C_d=0,92, ρ=800, p=1,37 bar -> ≈17 m/s","id":"f16"},{"cat":"KSS & Düse","name":"Düsendruck","formula":"p_D = ρ/2 · (v_KSS/C_d)²","symbol":"p_D","meaning":"Theoretischer statischer Druck vor der Düse","unit":"Pa / bar","notes":"Leitungsverluste separat addieren","example":"v=17 m/s, ρ=800, C_d=0,92 -> ≈1,37 bar","id":"f17"},{"cat":"KSS & Düse","name":"Pumpendruck","formula":"p_P = p_D + p_V","symbol":"p_P","meaning":"Erforderlicher Pumpendruck","unit":"bar","notes":"p_V = Leitungs-, Filter- und Ventilverluste","example":"1,37+1,50=2,87 bar","id":"f18"},{"cat":"KSS & Düse","name":"Massenstrom","formula":"ṁ = ρ · Q / 60","symbol":"ṁ","meaning":"Massenstrom","unit":"kg/s","notes":"ρ in kg/l, Q in l/min","example":"ρ=0,8, Q=60 -> 0,8 kg/s","id":"f19"},{"cat":"Kräfte & Leistung","name":"Netto-Schleifleistung","formula":"P_c = P_last - P_0","symbol":"P_c","meaning":"Prozessleistung ohne Leerlauf","unit":"kW","notes":"P_last und P_0 in kW","example":"8,0-2,0=6,0 kW","id":"f20"},{"cat":"Kräfte & Leistung","name":"Tangentialkraft","formula":"F_t = 1000 · P_c / v_c","symbol":"F_t","meaning":"Tangentialkraft an der Schleifscheibe","unit":"N","notes":"P_c in kW, v_c in m/s","example":"P_c=6 kW, v_c=20 -> 300 N","id":"f21"},{"cat":"Kräfte & Leistung","name":"Normalkraftmodell","formula":"F_n = η · F_t","symbol":"F_n","meaning":"Normalkraft als Modellwert","unit":"N","notes":"η muss gemessen oder begründet werden","example":"η=2, F_t=300 -> 600 N","id":"f22"},{"cat":"Kräfte & Leistung","name":"Resultierende Kraft","formula":"F_r = √(F_t² + F_n² + F_a²)","symbol":"F_r","meaning":"Resultierende Prozesskraft","unit":"N","notes":"F_a = Axialkraft","example":"300/600/0 -> 671 N","id":"f23"},{"cat":"Kräfte & Leistung","name":"Drehmoment","formula":"M = F_t · D_s / 2000","symbol":"M","meaning":"Drehmoment an der Schleifscheibe","unit":"N·m","notes":"D_s in mm","example":"F_t=300, D_s=300 -> 45 N·m","id":"f24"},{"cat":"Kräfte & Leistung","name":"Spezifische Energie","formula":"u = 1000 · P_c / Q_w","symbol":"u","meaning":"Spezifische Schleifenergie","unit":"J/mm³","notes":"P_c in kW, Q_w in mm³/s","example":"P=6 kW, Q=100 -> 60 J/mm³","id":"f25"},{"cat":"Kräfte & Leistung","name":"Leistung aus spezifischer Energie","formula":"P_c = u · Q_w / 1000","symbol":"P_c","meaning":"Prozessleistung","unit":"kW","notes":"u in J/mm³, Q_w in mm³/s","example":"u=60, Q=100 -> 6 kW","id":"f26"},{"cat":"Kräfte & Leistung","name":"Abdrängung","formula":"δ = F_n / k_n","symbol":"δ","meaning":"Elastische Abdrängung","unit":"µm","notes":"k_n in N/µm","example":"F_n=600 N, k=100 N/µm -> 6 µm","id":"f27"},{"cat":"Wärme","name":"Gesamtwärmestromdichte","formula":"q_t = 1000 · P_c / A_k","symbol":"q_t","meaning":"Mittlere Leistung pro Kontaktfläche","unit":"W/mm²","notes":"P_c in kW, A_k in mm²","example":"P_c=6 kW, A_k=50 mm² -> 120 W/mm²","id":"f28"},{"cat":"Wärme","name":"Werkstückwärmestrom","formula":"q_w = 1000 · β_w · P_c","symbol":"q_w","meaning":"Leistung, die in das Werkstück gelangt","unit":"W","notes":"P_c in kW; β_w begründen oder messen","example":"β_w=0,2; P_c=6 kW -> 1200 W","id":"f29"},{"cat":"Wärme","name":"Werkstück-Wärmestromdichte","formula":"q″_w = 1000 · β_w · P_c / A_k","symbol":"q″_w","meaning":"Mittlere Wärmestromdichte ins Werkstück","unit":"W/mm²","notes":"P_c in kW, A_k in mm²; β_w begründen oder messen","example":"β_w=0,2; P_c=6 kW; A_k=50 mm² -> 24 W/mm²","id":"f30"},{"cat":"Abrichten","name":"Abrichtvorschub","formula":"v_d = n_s · b_d / U_d","symbol":"v_d","meaning":"Axialer Abrichtvorschub","unit":"mm/min","notes":"b_d in mm, n_s in 1/min","example":"n=1000, b_d=0,8, U_d=4 -> 200 mm/min","id":"f31"},{"cat":"Abrichten","name":"Überdeckungsgrad","formula":"U_d = n_s · b_d / v_d","symbol":"U_d","meaning":"Überdeckungsgrad beim Abrichten","unit":"-","notes":"grössere Werte erzeugen feinere Topografie","example":"n=1000, b=0,8, v_d=200 -> 4","id":"f32"},{"cat":"Abrichten","name":"Rollengeschwindigkeit","formula":"v_R = π · D_R · n_R / 60 000","symbol":"v_R","meaning":"Umfangsgeschwindigkeit der Abrichtrolle","unit":"m/s","notes":"D_R in mm, n_R in 1/min","example":"D=100, n=2292 -> 12 m/s","id":"f33"},{"cat":"Schleifscheibe","name":"Kornkonzentration / Porenanteil","formula":"V_K + V_B + V_P = 100 %","symbol":"V","meaning":"Volumenbilanz von Korn, Bindung und Poren","unit":"%","notes":"Qualitative Spezifikationsbetrachtung","example":"mehr Poren -> mehr Spanraum und KSS-Zugang","id":"f34"},{"cat":"Geschwindigkeit","name":"Drehzahl aus Umfangsgeschwindigkeit","formula":"n = 60 000 * v / (pi * D)","symbol":"n","meaning":"Drehzahl","unit":"1/min","notes":"D in mm und v in m/s.","example":"v=35 m/s, D=400 mm -> n=1671,13 1/min","id":"f35"},{"cat":"Geschwindigkeit","name":"Tischvorschub pro Hub","formula":"v_f = L / t","symbol":"v_f","meaning":"Vorschubgeschwindigkeit","unit":"mm/min","notes":"L Weg in mm, t Zeit in min.","example":"L=600 mm, t=0,05 min -> 12 000 mm/min","id":"f36"},{"cat":"Abtrag","name":"Spezifischer Abtrag Rund-Einstechen","formula":"Q'_w = pi * d_w * v_fr","symbol":"Q'_w","meaning":"Spezifische Abtragsrate beim Einstechen","unit":"mm3/(mm*s)","notes":"v_fr in mm/s, d_w in mm.","example":"d_w=20 mm, v_fr=0,02 mm/s -> 1,26","id":"f37"},{"cat":"Abtrag","name":"Abtragsvolumen","formula":"V_w = Q_w * t","symbol":"V_w","meaning":"Abgetragenes Werkstueckvolumen","unit":"mm3","notes":"Q_w in mm3/s, t in s.","example":"Q_w=100 mm3/s, t=60 s -> 6000 mm3","id":"f38"},{"cat":"Kontakt","name":"Kontaktlaenge Aussenrund","formula":"l_g ≈ sqrt(a_e * D_eq)","symbol":"l_g","meaning":"Geometrische Kontaktlaenge","unit":"mm","notes":"D_eq ist der Ersatzdurchmesser aus Scheibe und Werkstueck.","example":"a_e=0,02 mm, D_eq=200 mm -> 2,00 mm" <script>(()=>{'use strict';
const D=window.APP_DATA,app=document.getElementById('app'),root=document.getElementById('overlayRoot'),toast=document.getElementById('toast');
const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)],clone=x=>JSON.parse(JSON.stringify(x));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc,num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d,hasNumber=v=>v!==null&&v!==''&&Number.isFinite(Number(v));
const fmt=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString('de-CH',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const STORAGE_KEY='schleifprozess_assistent_v3';
function merge(base,saved){if(!saved||typeof saved!=='object')return base;for(const[k,v]of Object.entries(saved)){if(Array.isArray(v))base[k]=clone(v);else if(v&&typeof v==='object')base[k]=merge(base[k]&&typeof base[k]==='object'?base[k]:{},v);else base[k]=v}return base}
function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);return r?merge(clone(D.defaultState),JSON.parse(r)):clone(D.defaultState)}catch(e){return clone(D.defaultState)}}
let state=loadState(),draft=null,currentSetupTab='machine',currentModule=null,returnFocus=null;
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn(e)}}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function setPath(o,path,v){const p=path.split('.');let x=o;for(let i=0;i<p.length-1;i++)x=x[p[i]];x[p.at(-1)]=v}
function safeLink(url,label='Herstellerquelle öffnen'){return /^https:\/\//i.test(url||'')?`<a class="source-link" href="${attr(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:''}
function summaryData(){const s=state.setup;return[['Maschine',`${s.machine.maker} ${s.machine.model}`],['Verfahren',s.process.type],['Prozessart',s.process.stage],['Werkstoff',s.material.name],['Scheibe',`${s.process.wheelMaker||'manuell'} ${s.process.wheelProduct||''}`.trim()],['KSS',s.kss.product],['Düse',`${fmt(calcNozzleArea(s.kss),2)} mm²`]]}
const modules=[['oil','💧','Ölstrahl & KSS','Volumenstrom, Strahlgeschwindigkeit und Druck'],['burn','♨','Schleifbrand','Abtragskennwerte und thermische Plausibilität'],['force','↗','Prozess & Kräfte','Leistung, Kräfte und Abdrängung'],['dress','◉','Abrichten','Abrichtvorschub und Geschwindigkeitsverhältnis'],['formula','ƒ','Formelbuch',`${D.formulas.length} geprüfte Zusammenhänge`],['whatif','?','Problemlösung',`${D.issues.length} Fehlerbilder und Massnahmen`]];
function renderHome(){app.innerHTML=`<main class="app"><header class="header"><div class="brand"><div class="logo"></div><div><h1>Schleifprozess Assistent</h1><p>Setup definieren · Prozess berechnen · Ursachen systematisch prüfen</p></div></div><div class="top-actions"><button class="btn primary" id="setupBtn">Setup bearbeiten</button><button class="btn" id="printBtn">Drucken</button><button class="btn" id="resetBtn">Zurücksetzen</button></div></header><section class="hero"><h2>Aktuelles Setup</h2><p>Technische Maschinenwerte werden nur automatisch übernommen, wenn die konkrete Angabe als Herstellerwert verifiziert ist.</p><div class="summary">${summaryData().map(x=>`<div class="summary-card"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}</div></section><section class="modules">${modules.map(m=>`<button class="module-card" data-open-module="${m[0]}"><span class="module-icon">${m[1]}</span><h3>${m[2]}</h3><p>${m[3]}</p><b>Öffnen →</b></button>`).join('')}</section></main>`;$('#setupBtn').onclick=openSetup;$('#printBtn').onclick=()=>window.print();$('#resetBtn').onclick=()=>{if(confirm('Alle Eingaben auf geprüfte Standardwerte zurücksetzen?')){state=clone(D.defaultState);saveState();renderHome();showToast('Zurückgesetzt')}};$$('[data-open-module]').forEach(b=>b.onclick=()=>openModule(b.dataset.openModule))}
function closeOverlay(){root.innerHTML='';document.body.classList.remove('modal-open');currentModule=null;returnFocus?.focus?.()}
function openSetup(){returnFocus=document.activeElement;draft=clone(state);currentSetupTab='machine';renderSetupSheet();document.body.classList.add('modal-open')}
function renderSetupSheet(){root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><section class="sheet"><header class="sheet-head"><div class="sheet-title"><h2 id="sheetTitle">Setup bearbeiten</h2><p>Änderungen werden erst mit „Setup übernehmen“ gespeichert.</p></div><div class="sheet-actions"><button class="btn" id="setupCancel">Abbrechen</button><button class="btn primary" id="setupSave">Setup übernehmen</button></div></header><div class="sheet-body setup-layout"><nav class="tabs" aria-label="Setup-Schritte">${[['machine','1 Maschine'],['material','2 Werkstoff'],['process','3 Prozess & Scheibe'],['kss','4 KSS & Düse']].map(x=>`<button class="tab ${x[0]===currentSetupTab?'active':''}" data-setup-tab="${x[0]}">${x[1]}</button>`).join('')}</nav><div class="setup-pane" id="setupPane"></div></div></section></div>`;renderSetupPane();$('#setupCancel').onclick=closeOverlay;$('#setupSave').onclick=saveSetup;$$('[data-setup-tab]').forEach(b=>b.onclick=()=>{captureSetupPane();currentSetupTab=b.dataset.setupTab;renderSetupSheet()})}
function tfield(id,label,value,opt={}){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" data-path="${attr(opt.path||'')}" data-value-type="text" value="${attr(value??'')}"><small>${esc(opt.help||'')}</small></div>`}
function nfield(id,label,value,unit,opt={}){const req=opt.required===false?'':'required';return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" data-path="${attr(opt.path||'')}" data-value-type="number" type="number" inputmode="decimal" value="${hasNumber(value)?attr(value):''}" ${opt.min!==undefined?`min="${opt.min}"`:''} ${opt.max!==undefined?`max="${opt.max}"`:''} step="${opt.step??'any'}" ${req}><small>${esc(unit||'')}${opt.help?' · '+esc(opt.help):''}</small></div>`}
function selectField(id,label,items,selected,opt={}){const opts=items.map(x=>Array.isArray(x)?x:[x,x]);return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" data-path="${attr(opt.path||'')}" data-value-type="text">${opts.map(([v,t])=>`<option value="${attr(v)}" ${String(v)===String(selected)?'selected':''}>${esc(t)}</option>`).join('')}</select><small>${esc(opt.help||'')}</small></div>`}
function renderSetupPane(){const p=$('#setupPane');p.innerHTML={machine:setupMachineHtml,material:setupMaterialHtml,process:setupProcessHtml,kss:setupKssHtml}[currentSetupTab]();bindSetupPane()}
function verifiedText(m){const map={power:'Leistung',maxRpm:'Drehzahl',maxDia:'Scheiben-Ø',maxWidth:'Scheibenbreite',maxWheelSpeed:'Umfangsgeschwindigkeit'};return(m.verifiedFields||[]).map(x=>map[x]||x).join(', ')||'keine technischen Werte'}
function setupMachineHtml(){const m=draft.setup.machine,makers=[...new Set(D.machines.map(x=>x.maker))].sort((a,b)=>a.localeCompare(b,'de')),models=D.machines.filter(x=>x.maker===m.maker);return `<section class="section"><h3>Maschine auswählen</h3><div class="grid">${selectField('machineMaker','Hersteller',makers,m.maker)}${tfield('machineSearch','Modell filtern','',{help:'Filtert nur die Modellliste.'})}${selectField('machineModel','Modell',models.map(x=>[x.id,x.model]),(models.find(x=>x.model===m.model)||{}).id||'')}</div><div class="status ${m.verified?'good':'warn'}"><b>${esc(m.dataQuality||'Datenstatus offen')}</b><br>${esc(m.source||'')}<br>Automatisch verifiziert: ${esc(verifiedText(m))}<br>${safeLink(m.sourceUrl)}</div></section><section class="section"><h3>Technische Maschinendaten</h3><div class="grid four">${nfield('machinePower','Spindelleistung',m.power,'kW',{path:'setup.machine.power',min:.1,max:1000,step:.1,required:false})}${nfield('machineRpm','Max. Drehzahl',m.maxRpm,'1/min',{path:'setup.machine.maxRpm',min:1,max:500000,step:1,required:false})}${nfield('machineDia','Max. Scheiben-Ø',m.maxDia,'mm',{path:'setup.machine.maxDia',min:1,max:3000,step:.1,required:false})}${nfield('machineWidth','Max. Scheibenbreite',m.maxWidth,'mm',{path:'setup.machine.maxWidth',min:.1,max:1000,step:.1,required:false})}${nfield('machineWheelSpeed','Max. Umfangsgeschwindigkeit',m.maxWheelSpeed,'m/s',{path:'setup.machine.maxWheelSpeed',min:.1,max:500,step:.1,required:false})}</div><div class="status warn">Leere Felder werden bewusst nicht geschätzt. Manuelle Angaben mit Typenschild, Spindelpaket oder Auftragsdokumentation abgleichen.</div></section>`}
function setupMaterialHtml(){const m=draft.setup.material,groups=[...new Set(D.materials.map(x=>x.group).filter(Boolean))].sort(),makers=[...new Set(D.materials.map(x=>x.maker).filter(Boolean))].sort();return `<section class="section"><h3>Werkstoff auswählen</h3><div class="grid">${selectField('matGroup','Werkstoffgruppe',[['','Alle'],...groups.map(x=>[x,x])],m.group)}${selectField('matMaker','Hersteller / Norm',[['','Alle'],...makers.map(x=>[x,x])],m.maker)}${tfield('matSearch','Suche','',{help:'Bezeichnung, Nummer oder Familie'})}</div><div class="field" style="margin-top:10px"><label for="matSelect">Werkstoff</label><select id="matSelect"></select></div></section><section class="section"><h3>Aktueller Werkstoff</h3><div class="grid two">${tfield('matName','Bezeichnung',m.name,{path:'setup.material.name'})}${tfield('matNumber','Nummer / Handelsname',m.number,{path:'setup.material.number'})}${tfield('matIso','ISO-Gruppe',m.iso,{path:'setup.material.iso'})}${tfield('matFamily','Werkstofffamilie',m.family,{path:'setup.material.family'})}${nfield('matHardness','Typische Härte',m.hardness,m.unit,{path:'setup.material.hardness',min:0,max:10000,step:.1,required:false})}${tfield('matUnit','Härteeinheit',m.unit,{path:'setup.material.unit'})}${tfield('matRange','Härtebereich',m.range,{path:'setup.material.range'})}${tfield('matVc','v_c Startfenster',m.vcRange,{path:'setup.material.vcRange'})}${tfield('matQp','Q′w Startfenster',m.qpRange,{path:'setup.material.qpRange'})}${tfield('matAbrasive','Schleifmittel-Hinweis',m.abrasive,{path:'setup.material.abrasive'})}${tfield('matBond','Bindungs-/Strukturhinweis',m.bond,{path:'setup.material.bond'})}${tfield('matCoolant','KSS-Hinweis',m.coolant,{path:'setup.material.coolant'})}<div class="field full"><label for="matHint">Detaillierter Hinweis</label><textarea id="matHint" data-path="setup.material.hint" data-value-type="text">${esc(m.hint||'')}</textarea></div></div><div class="status warn">${esc(m.sourceStatus||'Referenzdatensatz. Werkstoffzustand und Freigabe an der konkreten Anwendung prüfen.')}</div></section>`}
function processTypes(){return['Flachpendelschleifen','Tiefschleifen','Aussenrund-Laengsschleifen','Aussenrund-Einstechschleifen','Innenrundschleifen','Werkzeugschleifen','Profilschleifen','Verzahnungsschleifen','Centerless-Schleifen','Doppelseitenplanschleifen','sonstiges']}
function specific(v){return v!=null&&String(v).trim()!==''&&!/anwendungsspezifisch|kundenspezifisch|nach anwendung|^-$/i.test(String(v))}
function powerClass(p){return!hasNumber(p)?'unbekannt':p>=40?'hoch':p>=15?'mittel':'niedrig'}
function wheelRecommendations(s=draft.setup){const group=s.material.group,proc=s.process.type,pow=powerClass(s.machine.power);return D.wheels.filter(w=>(w.groups||[]).includes(group)&&(w.processes||[]).includes(proc)).map(w=>{let score=60;if(w.sourceUrl)score+=12;if(/hersteller/i.test(w.sourceQuality||''))score+=8;if(pow!=='unbekannt'&&w.powerClass){if(w.powerClass===pow)score+=15;else if((pow==='hoch'&&w.powerClass==='mittel')||(pow==='mittel'&&w.powerClass==='niedrig'))score+=5;else score-=8}for(const k of['grit','grade','structure'])if(specific(w[k]))score+=2;return{...w,_score:score,_confidence:score>=90?'hoch':score>=75?'mittel':'eingeschränkt'}}).sort((a,b)=>b._score-a._score||a.maker.localeCompare(b.maker,'de'))}
function setupProcessHtml(){const p=draft.setup.process,recs=wheelRecommendations(),r=recs[0],makers=[...new Set(D.wheels.map(x=>x.maker))].sort(),families=D.wheels.filter(x=>x.maker===p.wheelMaker);return `<section class="section"><h3>Prozess und Kinematik</h3><div class="grid">${selectField('processType','Schleifverfahren',processTypes(),p.type,{path:'setup.process.type'})}${selectField('processStage','Prozessart',['Schruppen','Schlichten','kombinierter Prozess'],p.stage,{path:'setup.process.stage'})}${nfield('wheelDia','Scheibendurchmesser',p.wheelDia,'mm',{path:'setup.process.wheelDia',min:.1,max:3000,step:.1})}${nfield('wheelWidth','Scheibenbreite',p.wheelWidth,'mm',{path:'setup.process.wheelWidth',min:.01,max:1000,step:.01})}${nfield('activeWidth','Aktive Schleifbreite',p.activeWidth,'mm',{path:'setup.process.activeWidth',min:.01,max:1000,step:.01})}${nfield('wheelSpeed','Scheibengeschwindigkeit v_c',p.wheelSpeed,'m/s',{path:'setup.process.wheelSpeed',min:.01,max:250,step:.01})}${nfield('wheelRpm','Scheibendrehzahl n_s',p.wheelRpm,'1/min',{path:'setup.process.wheelRpm',min:1,max:500000,step:.1})}</div><div class="status warn">Verifizierte Maschinenlimits: Drehzahl ${hasNumber(draft.setup.machine.maxRpm)?fmt(draft.setup.machine.maxRpm,0)+' 1/min':'offen'} · Scheiben-Ø ${hasNumber(draft.setup.machine.maxDia)?fmt(draft.setup.machine.maxDia,0)+' mm':'offen'} · Breite ${hasNumber(draft.setup.machine.maxWidth)?fmt(draft.setup.machine.maxWidth,0)+' mm':'offen'} · v_c ${hasNumber(draft.setup.machine.maxWheelSpeed)?fmt(draft.setup.machine.maxWheelSpeed,1)+' m/s':'offen'}</div></section><section class="section"><h3>Schleifscheiben-Assistent</h3>${r?`<div class="recommend"><div class="recommend-head"><div><span class="badge ${r._confidence==='hoch'?'good':'warn'}">Konfidenz ${esc(r._confidence)}</span><h4>${esc(r.maker)} · ${esc(r.product)}</h4><p>${esc(r.note)}</p></div><b>${r._score} Punkte</b></div><div class="specs">${[['Schleifmittel',r.abrasive],['Bindung',r.bond],['Körnung',r.grit],['Härte',r.grade],['Struktur',r.structure]].map(x=>`<div class="spec"><span>${x[0]}</span><strong>${esc(x[1])}</strong></div>`).join('')}</div><div class="inline-actions"><button class="btn primary" id="applyWheel" data-wheel-id="${r.id}">Vorschlag übernehmen</button><button class="btn" id="showAlternatives">Alternativen (${recs.length})</button>${safeLink(r.sourceUrl)}</div></div>`:`<div class="status warn">Für diese Werkstoffgruppe und dieses Verfahren ist keine kompatible Produktfamilie im Katalog hinterlegt. Es wird bewusst kein ungeprüfter Vorschlag erzeugt.</div>`}<div class="grid two" style="margin-top:11px">${selectField('wheelMaker','Hersteller',makers,p.wheelMaker)}${selectField('wheelProduct','Produktfamilie',families.map(x=>[x.id,x.product]),(families.find(x=>x.product===p.wheelProduct)||{}).id||'')}${tfield('processAbrasive','Schleifmittel',p.abrasive,{path:'setup.process.abrasive'})}${tfield('processBond','Bindung',p.bond,{path:'setup.process.bond'})}${tfield('grit','Korngrösse',p.grit,{path:'setup.process.grit',help:'z. B. 60, B126 oder D91'})}${tfield('grade','Härtegrad',p.grade,{path:'setup.process.grade',help:'z. B. J oder P'})}${tfield('structure','Struktur',p.structure,{path:'setup.process.structure'})}</div></section>`}
function setupKssHtml(){const k=draft.setup.kss,types=[...new Set(D.products.map(x=>x.type))],families=[...new Set(D.products.filter(x=>x.type===k.type).map(x=>x.family))],prods=D.products.filter(x=>x.type===k.type&&x.family===k.family);let geom='';if(k.nozzleType==='round')geom=nfield('nozzleCount','Anzahl',k.count,'Stk.',{path:'setup.kss.count',min:1,max:100,step:1})+nfield('nozzleDia','Innendurchmesser',k.diameter,'mm',{path:'setup.kss.diameter',min:.01,max:200,step:.01});else if(['flat','slot'].includes(k.nozzleType))geom=nfield('nozzleCount','Anzahl',k.count,'Stk.',{path:'setup.kss.count',min:1,max:100,step:1})+nfield('nozzleWidth','Breite',k.width,'mm',{path:'setup.kss.width',min:.01,max:1000,step:.01})+nfield('nozzleHeight','Spalthöhe',k.height,'mm',{path:'setup.kss.height',min:.01,max:100,step:.01});else if(k.nozzleType==='annular')geom=nfield('nozzleCount','Anzahl',k.count,'Stk.',{path:'setup.kss.count',min:1,max:100,step:1})+nfield('nozzleOuter','Aussen-Ø',k.outerDiameter,'mm',{path:'setup.kss.outerDiameter',min:.01,max:500,step:.01})+nfield('nozzleInner','Innen-Ø',k.innerDiameter,'mm',{path:'setup.kss.innerDiameter',min:0,max:499,step:.01});else geom=nfield('nozzleArea','Gesamtfläche',k.totalArea,'mm²',{path:'setup.kss.totalArea',min:.0001,max:100000,step:.001});return `<section class="section"><h3>KSS auswählen</h3><div class="grid">${selectField('kssType','KSS-Art',types,k.type)}${selectField('kssFamily','Produktfamilie',families,k.family)}${selectField('kssProduct','Produkt',prods.map(x=>[x.id,x.name]),(prods.find(x=>x.name===k.product)||{}).id||'')}${nfield('kssDensity','Dichte Gebrauchslösung / Öl',k.densityUse,'kg/l',{path:'setup.kss.densityUse',min:.1,max:2,step:.001})}${nfield('kssConcentration','Konzentration',k.concentration,'%',{path:'setup.kss.concentration',min:0,max:100,step:.1})}${nfield('kssVisc','Viskosität 40 °C',k.visc,'mm²/s',{path:'setup.kss.visc',min:.01,max:10000,step:.01,required:false,help:'optional; leer = kein verifizierter Katalogwert'})}${tfield('kssArticle','Artikelnummer',k.article,{path:'setup.kss.article'})}${tfield('kssBasis','Basis',k.basis,{path:'setup.kss.basis'})}</div><div class="status warn"><b>Datenstatus:</b> Fehlende Dichte oder Viskosität wird nicht geschätzt. Die Dichte ist für hydraulische Berechnungen erforderlich; Viskosität ist hier informativ.</div></section><section class="section"><h3>Düse und Zuführung</h3><div class="grid">${selectField('nozzleType','Düsenform',[['round','Runddüse'],['flat','Flachdüse'],['slot','Schlitzdüse'],['annular','Ringdüse'],['custom','Gesamtfläche direkt']],k.nozzleType,{path:'setup.kss.nozzleType'})}${geom}${nfield('nozzleCd','Ausflussbeiwert C_d',k.cd,'-',{path:'setup.kss.cd',min:.01,max:1.5,step:.01})}${nfield('lineLoss','Leitungsverlust',k.lineLoss,'bar',{path:'setup.kss.lineLoss',min:0,max:100,step:.01})}${nfield('nozzleAngle','Düsenwinkel',k.angle,'°',{path:'setup.kss.angle',min:-180,max:180,step:.1})}${nfield('nozzleDistance','Abstand Kontaktzone',k.distance,'mm',{path:'setup.kss.distance',min:0,max:2000,step:.1})}${selectField('tangential','Tangential ausgerichtet',[['true','Ja'],['false','Nein']],String(k.tangential),{path:'setup.kss.tangential'})}</div><div class="status good">Freie Gesamtfläche: <b id="nozzleAreaPreview">${fmt(calcNozzleArea(k),2)} mm²</b></div></section>`}
function filteredMaterials(){const g=$('#matGroup')?.value??draft.setup.material.group,m=$('#matMaker')?.value??draft.setup.material.maker,q=($('#matSearch')?.value||'').toLowerCase();return D.materials.filter(x=>(!g||x.group===g)&&(!m||x.maker===m)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)))}
function updateMaterialOptions(){const s=$('#matSelect');if(!s)return;const list=filteredMaterials();s.innerHTML=list.map(x=>`<option value="${x.id}" ${x.name===draft.setup.material.name&&x.number===draft.setup.material.number?'selected':''}>${esc(x.name)} · ${esc(x.number)} · ${esc(x.maker)}</option>`).join('')}
function applyWheel(w,include=true){if(!w)return;const p=draft.setup.process;p.wheelMaker=w.maker;p.wheelProduct=w.product;if(include){if(specific(w.abrasive))p.abrasive=w.abrasive;if(specific(w.bond))p.bond=w.bond;if(specific(w.grit))p.grit=String(w.grit).split('-')[0];if(specific(w.grade))p.grade=String(w.grade).split('-')[0];if(specific(w.structure))p.structure=String(w.structure).match(/[0-9]+/)?.[0]||w.structure}}
function applyProduct(p){Object.assign(draft.setup.kss,{type:p.type,family:p.family,product:p.name,article:p.article||'',basis:p.basis||'',densityUse:p.density??null,visc:p.visc??null,flash:p.flash,ester:p.ester})}
function captureSetupPane(){const p=$('#setupPane');if(!p||!draft)return;$$('[data-path]',p).forEach(el=>{if(!el.dataset.path)return;let v=el.value;if(el.dataset.valueType==='number')v=v===''?null:Number(v);if(el.id==='tangential')v=v==='true';setPath(draft,el.dataset.path,v)})}
function bindSetupPane(){const pane=$('#setupPane');pane.addEventListener('input',e=>{const el=e.target;if(el.dataset.path){let v=el.value;if(el.dataset.valueType==='number')v=v===''?null:Number(v);setPath(draft,el.dataset.path,v);if(el.id==='wheelDia'||el.id==='wheelSpeed'){const p=draft.setup.process;if(num(p.wheelDia)>0&&num(p.wheelSpeed)>0){p.wheelRpm=60000*p.wheelSpeed/(Math.PI*p.wheelDia);if($('#wheelRpm'))$('#wheelRpm').value=p.wheelRpm.toFixed(2)}}if(el.id==='wheelRpm'){const p=draft.setup.process;if(num(p.wheelDia)>0&&num(p.wheelRpm)>0){p.wheelSpeed=Math.PI*p.wheelDia*p.wheelRpm/60000;if($('#wheelSpeed'))$('#wheelSpeed').value=p.wheelSpeed.toFixed(3)}}if(el.id.startsWith('nozzle')&&$('#nozzleAreaPreview'))$('#nozzleAreaPreview').textContent=fmt(calcNozzleArea(draft.setup.kss),2)+' mm²'}});pane.addEventListener('change',e=>{const el=e.target;if(el.dataset.path){let v=el.value;if(el.dataset.valueType==='number')v=v===''?null:Number(v);if(el.id==='tangential')v=v==='true';setPath(draft,el.dataset.path,v)}if(el.id==='machineMaker'){const m=D.machines.find(x=>x.maker===el.value);if(m){draft.setup.machine=clone(m);renderSetupPane()}}else if(el.id==='machineModel'){const m=D.machines.find(x=>x.id===el.value);if(m){draft.setup.machine=clone(m);renderSetupPane()}}else if(['matGroup','matMaker'].includes(el.id))updateMaterialOptions();else if(el.id==='matSelect'){const m=D.materials.find(x=>x.id===el.value);if(m){draft.setup.material=clone(m);renderSetupPane()}}else if(['processType','processStage'].includes(el.id))renderSetupPane();else if(el.id==='wheelMaker'){const w=D.wheels.find(x=>x.maker===el.value);if(w){applyWheel(w,false);renderSetupPane()}}else if(el.id==='wheelProduct'){const w=D.wheels.find(x=>x.id===el.value);if(w){applyWheel(w,true);renderSetupPane()}}else if(el.id==='kssType'){const p=D.products.find(x=>x.type===el.value);if(p){applyProduct(p);renderSetupPane()}}else if(el.id==='kssFamily'){const p=D.products.find(x=>x.type===draft.setup.kss.type&&x.family===el.value);if(p){applyProduct(p);renderSetupPane()}}else if(el.id==='kssProduct'){const p=D.products.find(x=>x.id===el.value);if(p){applyProduct(p);renderSetupPane()}}else if(el.id==='nozzleType')renderSetupPane()});if($('#machineSearch'))$('#machineSearch').oninput=e=>{const q=e.target.value.toLowerCase(),s=$('#machineModel');s.innerHTML=D.machines.filter(x=>x.maker===draft.setup.machine.maker&&(!q||x.model.toLowerCase().includes(q))).map(x=>`<option value="${x.id}" ${x.model===draft.setup.machine.model?'selected':''}>${esc(x.model)}</option>`).join('')};if($('#matSearch'))$('#matSearch').oninput=updateMaterialOptions;updateMaterialOptions();if($('#applyWheel'))$('#applyWheel').onclick=()=>{applyWheel(D.wheels.find(x=>x.id===$('#applyWheel').dataset.wheelId),true);renderSetupPane()};if($('#showAlternatives'))$('#showAlternatives').onclick=showWheelAlternatives}
function validateSetup(){captureSetupPane();const e=[],p=draft.setup.process,k=draft.setup.kss,m=draft.setup.machine;if(!(num(p.wheelDia)>0))e.push('Scheibendurchmesser muss grösser als 0 sein.');if(!(num(p.wheelWidth)>0))e.push('Scheibenbreite muss grösser als 0 sein.');if(!(num(p.activeWidth)>0))e.push('Aktive Schleifbreite muss grösser als 0 sein.');if(!(num(p.wheelSpeed)>0))e.push('Scheibengeschwindigkeit muss grösser als 0 sein.');if(!(num(k.densityUse)>0))e.push('KSS-Dichte muss grösser als 0 sein.');if(!(num(k.cd)>0))e.push('Ausflussbeiwert muss grösser als 0 sein.');if(!(calcNozzleArea(k)>0))e.push('Düsenfläche muss grösser als 0 sein.');if(k.nozzleType==='annular'&&num(k.outerDiameter)<=num(k.innerDiameter))e.push('Bei der Ringdüse muss der Aussen-Ø grösser als der Innen-Ø sein.');if(hasNumber(m.maxRpm)&&num(p.wheelRpm)>num(m.maxRpm))e.push(`Drehzahl überschreitet den verifizierten Maschinenwert ${fmt(m.maxRpm,0)} 1/min.`);if(hasNumber(m.maxDia)&&num(p.wheelDia)>num(m.maxDia))e.push(`Scheiben-Ø überschreitet den verifizierten Maschinenwert ${fmt(m.maxDia,1)} mm.`);if(hasNumber(m.maxWidth)&&num(p.wheelWidth)>num(m.maxWidth))e.push(`Scheibenbreite überschreitet den verifizierten Maschinenwert ${fmt(m.maxWidth,1)} mm.`);if(hasNumber(m.maxWheelSpeed)&&num(p.wheelSpeed)>num(m.maxWheelSpeed))e.push(`v_c überschreitet den verifizierten Maschinenwert ${fmt(m.maxWheelSpeed,1)} m/s.`);return e}
function saveSetup(){const e=validateSetup();$('.validation-box')?.remove();if(e.length){const b=document.createElement('div');b.className='validation-box';b.innerHTML='<b>Setup nicht übernommen:</b><br>'+e.map(esc).join('<br>');$('#setupPane').prepend(b);return}state=clone(draft);saveState();closeOverlay();renderHome();showToast('Setup übernommen')}
function showWheelAlternatives(){const r=wheelRecommendations();openDetail('Schleifscheiben-Alternativen',`${draft.setup.material.name} · ${draft.setup.process.type}`,`<div class="cards">${r.map(x=>`<button class="info-card" data-alt-wheel="${x.id}"><span class="badge">${esc(x.maker)}</span><h4>${esc(x.product)}</h4><p>${esc(x.abrasive)} · ${esc(x.bond)}<br>${esc(x.note)}</p></button>`).join('')}</div>`);$$('[data-alt-wheel]').forEach(b=>b.onclick=()=>{applyWheel(D.wheels.find(x=>x.id===b.dataset.altWheel),true);closeDetail();renderSetupPane()})}
function calcNozzleArea(k){const n=Math.max(num(k.count,1),0);if(k.nozzleType==='round')return n*Math.PI*Math.pow(num(k.diameter),2)/4;if(['flat','slot'].includes(k.nozzleType))return n*num(k.width)*num(k.height);if(k.nozzleType==='annular')return n*Math.PI*(Math.pow(num(k.outerDiameter),2)-Math.pow(num(k.innerDiameter),2))/4;return num(k.totalArea)}
function moduleField(id,label,value,unit,opt={}){return nfield(id,label,value,unit,{min:opt.min,max:opt.max,step:opt.step??'any',required:opt.required,path:''})}
function openModule(id){returnFocus=document.activeElement;currentModule=id;const defs={oil:['Ölstrahl & KSS','Düsen- und Strahlberechnung'],burn:['Schleifbrand','Prozesskennwerte und thermische Plausibilität'],force:['Prozess & Kräfte','Leistung, Kräfte und Abdrängung'],dress:['Abrichten','Abrichtparameter und Scheibentopografie'],formula:['Formelbuch',`${D.formulas.length} Formeln`],whatif:['Problemlösung',`${D.issues.length} Fehlerbilder`]};const[t,s]=defs[id];root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><section class="sheet"><header class="sheet-head"><div class="sheet-title"><h2>${t}</h2><p>${s}</p></div><div class="sheet-actions"><button class="btn" id="moduleBack">← Zurück</button><button class="btn" id="moduleClose">Schliessen</button></div></header><div class="sheet-body" id="moduleBody">${moduleHtml(id)}</div></section></div>`;document.body.classList.add('modal-open');$('#moduleBack').onclick=$('#moduleClose').onclick=closeOverlay;bindModule(id);if(['oil','burn','force','dress'].includes(id))updateModuleResults(id)}
function moduleHtml(id){return{id:0,oil:oilHtml,burn:burnHtml,force:forceHtml,dress:dressHtml,formula:formulaHtml,whatif:whatifHtml}[id]()}
function oilHtml(){const o=state.oil;return `<div class="module-layout"><section class="section controls"><h3>Mess- und Referenzwerte</h3><div class="grid two">${selectField('oilMode','Messmethode',[['volume','Volumen messen'],['weight','Gewicht messen']],o.mode)}${moduleField('oilLead',o.mode==='weight'?'Gemessenes Gewicht':'Gemessenes Volumen',o.mode==='weight'?o.weight:o.volume,o.mode==='weight'?'kg':'l',{min:.000001,step:.001})}${moduleField('oilTime','Messzeit',o.time,'s',{min:.000001,step:.01})}${moduleField('oilPressure','Druck vor Düse',o.referencePressure??o.pressure,'bar',{min:0,step:.01})}${moduleField('oilTolerance','Toleranz',o.tolerancePct,'%',{min:1,max:50,step:1})}</div><div id="oilErrors"></div></section><section class="section results"><h3>Hydraulische Kennwerte</h3><div id="oilResults"></div></section></div>`}
function burnHtml(){const b=state.burn,p=state.setup.process;return `<div class="module-layout"><section class="section controls"><h3>Notwendige Prozesswerte</h3><div class="grid two burn-controls">${moduleField('burnVw','Tisch-/Werkstückgeschwindigkeit v_w',b.vw,'m/min',{min:.0001,step:.001})}${moduleField('burnAe','Zustellung a_e',b.ae,'mm',{min:.000001,step:.0001})}${moduleField('burnWidth','Aktive Schleifbreite',p.activeWidth,'mm',{min:.0001,step:.01})}${selectField('burnDressing','Abrichtzustand',[['sharp','scharf / offen'],['normal','normal'],['dull','stumpf / zugesetzt']],b.dressing)}</div><div id="burnErrors"></div><div class="callout"><b>Werkstoff-Startfenster:</b> v_c ${esc(state.setup.material.vcRange||'nicht hinterlegt')} · Q′w ${esc(state.setup.material.qpRange||'nicht hinterlegt')} · ${esc(state.setup.material.hint||'')}</div></section><section class="section results"><h3>Kennwerte mit Ist, Ziel und Wirkung</h3><div id="burnResults"></div></section></div>`}
function forceHtml(){const f=state.force;return `<div class="module-layout"><section class="section controls"><h3>Kraftbasis</h3><div class="grid two">${selectField('forceBasis','Berechnungsbasis',[['measured','Leistung gemessen'],['estimate','Modellbereich'],['energy','Spezifische Energie']],f.basis)}${f.basis==='measured'?moduleField('forceLoad','Leistung beim Schleifen',f.load,'kW',{min:0,step:.01})+moduleField('forceIdle','Leerlaufleistung',f.idle,'kW',{min:0,step:.01}):f.basis==='energy'?moduleField('forceU','Spezifische Energie u',f.u,'J/mm³',{min:.0001,step:.1}):''}${moduleField('forceEta','η = F_n/F_t',f.eta,'-',{min:.0001,step:.01})}${moduleField('forceFn','Normalkraft gemessen',f.fnMeasured,'N',{min:0,step:.1,required:false})}${moduleField('forceFa','Axialkraft',f.fa,'N',{min:0,step:.1,required:false})}${moduleField('forceStiff','Systemsteifigkeit',f.stiffness,'N/µm',{min:0,step:.1,required:false})}</div><div id="forceErrors"></div></section><section class="section results"><h3>Ergebnis</h3><div id="forceResults"></div></section></div>`}
function dressHtml(){const d=state.dress;return `<div class="module-layout"><section class="section controls"><h3>Abrichtwerte</h3><div class="grid two">${selectField('dressMode','Abrichter',[['stationary','stehender Abrichter'],['rotary','rotierende Rolle']],d.mode)}${moduleField('dressBd','Wirkbreite b_d',d.bd,'mm',{min:.0001,step:.01})}${moduleField('dressUd','Überdeckungsgrad U_d',d.Ud,'-',{min:.0001,step:.01})}${moduleField('dressAd','Abrichtzustellung a_d',d.ad,'mm',{min:.000001,step:.001})}${d.mode==='rotary'?moduleField('dressVr','Rollengeschwindigkeit v_R',d.rollerSpeed,'m/s',{min:0,step:.01})+selectField('dressDirection','Drehrichtung',[['same','Gleichlauf'],['opposite','Gegenlauf']],d.direction):''}</div><div id="dressErrors"></div></section><section class="section results"><h3>Ergebnis</h3><div id="dressResults"></div></section></div>`}
function formulaHtml(){const cats=[...new Set(D.formulas.map(x=>x.cat))];return `<section class="section"><h3>Formel suchen</h3><input class="search" id="formulaSearch" placeholder="Name, Symbol, Einheit oder Bedeutung"><div class="category-grid">${cats.map(c=>`<button class="category-card" data-formula-cat="${attr(c)}"><b>${esc(c)}</b><p>${D.formulas.filter(x=>x.cat===c).length} Formeln</p></button>`).join('')}</div><div id="formulaResults"></div></section>`}
function whatifHtml(){const cats=[...new Set(D.issues.map(x=>x.cat))];return `<section class="section"><h3>Problem suchen</h3><div class="grid two"><div class="field"><label for="issueSearch">Beschreibung</label><input id="issueSearch" class="search" placeholder="z. B. Brand am Hubende, Rattermarken, Schaum"></div><div class="field"><label>&nbsp;</label><button class="btn primary" id="issueAnalyze">Analysieren</button></div></div><div class="category-grid">${cats.map(c=>`<button class="category-card" data-issue-cat="${attr(c)}"><b>${esc(c)}</b><p>${D.issues.filter(x=>x.cat===c).length} Situationen</p></button>`).join('')}</div><div id="issueResults"></div></section>`}
function updateModuleState(id,el){const map={oilMode:['oil','mode'],oilLead:['oil',state.oil.mode==='weight'?'weight':'volume'],oilTime:['oil','time'],oilPressure:['oil','referencePressure'],oilTolerance:['oil','tolerancePct'],burnVw:['burn','vw'],burnAe:['burn','ae'],burnWidth:['setup.process','activeWidth'],burnDressing:['burn','dressing'],forceBasis:['force','basis'],forceLoad:['force','load'],forceIdle:['force','idle'],forceU:['force','u'],forceEta:['force','eta'],forceFn:['force','fnMeasured'],forceFa:['force','fa'],forceStiff:['force','stiffness'],dressMode:['dress','mode'],dressBd:['dress','bd'],dressUd:['dress','Ud'],dressAd:['dress','ad'],dressVr:['dress','rollerSpeed'],dressDirection:['dress','direction']};const m=map[el.id];if(!m)return;const v=el.tagName==='SELECT'?el.value:(el.value===''?0:Number(el.value));setPath(state,m[0]+'.'+m[1],v);if(el.id==='oilPressure')state.oil.pressure=v;saveState()}
function bindModule(id){const body=$('#moduleBody');body.addEventListener('input',e=>{updateModuleState(id,e.target);if(['oil','burn','force','dress'].includes(id))updateModuleResults(id)});body.addEventListener('change',e=>{updateModuleState(id,e.target);if(['oilMode','forceBasis','dressMode'].includes(e.target.id)){openModule(id);return}if(['oil','burn','force','dress'].includes(id))updateModuleResults(id)});if(id==='formula'){const s=$('#formulaSearch');s.oninput=()=>renderFormulaList(D.formulas.filter(f=>Object.values(f).join(' ').toLowerCase().includes(s.value.toLowerCase())));$$('[data-formula-cat]').forEach(b=>b.onclick=()=>renderFormulaList(D.formulas.filter(f=>f.cat===b.dataset.formulaCat)))}if(id==='whatif'){$$('[data-issue-cat]').forEach(b=>b.onclick=()=>renderIssueList(D.issues.filter(x=>x.cat===b.dataset.issueCat)));$('#issueAnalyze').onclick=()=>{const q=$('#issueSearch').value.toLowerCase().trim(),sc=D.issues.map(x=>({...x,_score:(x.keys||[]).reduce((s,k)=>s+(q.includes(k.toLowerCase())?3:0),0)+(x.title.toLowerCase().includes(q)?4:0)})).filter(x=>x._score>0).sort((a,b)=>b._score-a._score);renderIssueList(sc.length?sc:D.issues.slice(0,8))}}}
function calcOil(setup,o){const k=setup.kss,A=calcNozzleArea(k),rho=num(k.densityUse)*1000,Cd=num(k.cd),vc=num(setup.process.wheelSpeed),t=num(o.time),tol=num(o.tolerancePct,10),e=[];if(!(A>0))e.push('Düsenfläche muss grösser als 0 sein.');if(!(rho>0))e.push('KSS-Dichte muss grösser als 0 sein.');if(!(Cd>0))e.push('C_d muss grösser als 0 sein.');if(!(vc>0))e.push('v_c muss grösser als 0 sein.');if(!(t>0))e.push('Messzeit muss grösser als 0 sein.');if(!(tol>=1&&tol<=50))e.push('Toleranz muss zwischen 1 und 50 % liegen.');const amount=o.mode==='weight'?num(o.weight)/(rho/1000):num(o.volume),flow=amount*60/t,measuredV=flow/(.06*A),netP=Math.max(num(o.referencePressure)-num(k.lineLoss),0),pressureV=Cd*Math.sqrt(2*netP*100000/rho),requiredFlow=.06*A*vc,requiredP=rho*Math.pow(vc/Cd,2)/(2*100000)+num(k.lineLoss),ratio=measuredV/vc;return{errors:e,A,flow,measuredV,pressureV,requiredFlow,requiredP,ratio,low:vc*(1-tol/100),high:vc*(1+tol/100)}}
function profileFor(t,s){return{'Flachpendelschleifen|Schruppen':{qs:[60,80],qp:[2.5,10]},'Flachpendelschleifen|Schlichten':{qs:[80,120],qp:[1.5,5]},'Tiefschleifen|Schruppen':{qs:[1000,2000],qp:[5,50]},'Tiefschleifen|Schlichten':{qs:[1000,2500],qp:[2.5,25]}}[`${t}|${s}`]||null}
function calcBurn(setup,b){const p=setup.process,vc=num(p.wheelSpeed),vw=num(b.vw),ae=num(b.ae),width=num(p.activeWidth),Ds=num(p.wheelDia),e=[];if(!(vc>0))e.push('v_c muss grösser als 0 sein.');if(!(vw>0))e.push('v_w muss grösser als 0 sein.');if(!(ae>0))e.push('a_e muss grösser als 0 sein.');if(!(width>0))e.push('Aktive Breite muss grösser als 0 sein.');if(!(Ds>0))e.push('Scheibendurchmesser muss grösser als 0 sein.');return{errors:e,vc,vw,ae,width,qs:60*vc/vw,qp:ae*vw*1000/60,Q:ae*vw*1000/60*width,heq:(ae*vw*1000/60)/(1000*vc),lg:Math.sqrt(Ds*ae),profile:profileFor(p.type,p.stage)}}
function calcForce(setup,b,f){const m=calcBurn(setup,b),e=[...m.errors];if(e.length)return{errors:e};let p0,p1,model=false;if(f.basis==='measured'){const l=num(f.load),i=num(f.idle);if(l<i)e.push('Schleifleistung darf nicht kleiner als Leerlaufleistung sein.');p0=p1=l-i}else if(f.basis==='energy'){if(!(num(f.u)>0))e.push('Spezifische Energie muss grösser als 0 sein.');p0=p1=num(f.u)*m.Q/1000}else{model=true;const z=`${setup.material.family} ${setup.material.group}`.toLowerCase();let u=[35,80];if(/hss|werkzeug|wälzlager|gehärt/.test(z))u=[50,140];if(/nickel|titan|kobalt/.test(z))u=[80,220];if(/hartmetall|keramik|superhart/.test(z))u=[30,120];p0=u[0]*m.Q/1000;p1=u[1]*m.Q/1000}if(!(num(f.eta)>0))e.push('η muss grösser als 0 sein.');if(e.length)return{errors:e};const ft=[p0*1000/m.vc,p1*1000/m.vc],fnm=num(f.fnMeasured)>0,fn=fnm?[num(f.fnMeasured),num(f.fnMeasured)]:ft.map(x=>x*num(f.eta)),fa=Math.max(num(f.fa),0),fr=[Math.hypot(ft[0],fn[0],fa),Math.hypot(ft[1],fn[1],fa)],torque=ft.map(x=>x*num(setup.process.wheelDia)/2000),st=num(f.stiffness),defl=st>0?fn.map(x=>x/st):[NaN,NaN];return{errors:e,model,power:[p0,p1],ft,fn,fnMeasured:fnm,fr,torque,defl,m}}
function calcDress(setup,d){const ns=num(setup.process.wheelRpm),vc=num(setup.process.wheelSpeed),bd=num(d.bd),Ud=num(d.Ud),ad=num(d.ad),vr=num(d.rollerSpeed),e=[];if(!(ns>0))e.push('Scheibendrehzahl muss grösser als 0 sein.');if(!(vc>0))e.push('Scheibengeschwindigkeit muss grösser als 0 sein.');if(!(bd>0))e.push('Wirkbreite muss grösser als 0 sein.');if(!(Ud>0))e.push('Überdeckungsgrad muss grösser als 0 sein.');if(!(ad>0))e.push('Abrichtzustellung muss grösser als 0 sein.');if(d.mode==='rotary'&&vr<0)e.push('Rollengeschwindigkeit darf nicht negativ sein.');return{errors:e,vd:ns*bd/Ud,qd:d.mode==='rotary'?(d.direction==='opposite'?-vr/vc:vr/vc):NaN}}
function kpi(n,v,u,c=''){return`<div class="kpi ${c}"><span>${esc(n)}</span><strong>${esc(v)}</strong><small>${esc(u)}</small></div>`}function errorBlock(id,e){$('#'+id).innerHTML=e.length?`<div class="status bad">${e.map(esc).join('<br>')}</div>`:''}function range(a,d=2){return Math.abs(a[0]-a[1])<1e-10?fmt(a[0],d):`${fmt(a[0],d)}–${fmt(a[1],d)}`}function rangeStatus(v,r){return v<r[0]?'bad':v>r[1]?'warn':'good'}
function updateModuleResults(id){if(id==='oil'){const r=calcOil(state.setup,state.oil);errorBlock('oilErrors',r.errors);$('#oilResults').innerHTML=r.errors.length?'':`<div class="kpis">${kpi('Düsenfläche',fmt(r.A,2),'mm²')}${kpi('Volumenstrom',fmt(r.flow,2),'l/min')}${kpi('Strahlgeschwindigkeit',fmt(r.measuredV,2),'m/s',r.ratio>=.9&&r.ratio<=1.1?'good':'warn')}${kpi('v_KSS / v_c',fmt(r.ratio,2),'-',r.ratio>=.9&&r.ratio<=1.1?'good':'warn')}${kpi('Soll-Volumenstrom 1:1',fmt(r.requiredFlow,2),'l/min')}${kpi('Soll-Druck inkl. Verlust',fmt(r.requiredP,2),'bar')}${kpi('Geschwindigkeit aus Druck',fmt(r.pressureV,2),'m/s')}${kpi('Toleranzfenster',`${fmt(r.low,1)}–${fmt(r.high,1)}`,'m/s')}</div><div class="callout">Hydraulischer Sollwert; Strahlkohärenz, Ausrichtung und reale Verluste an der Maschine prüfen.</div>`}if(id==='burn'){const r=calcBurn(state.setup,state.burn);errorBlock('burnErrors',r.errors);$('#burnResults').innerHTML=r.errors.length?'':`<div class="kpis">${kpi('q_s',fmt(r.qs,1),'-',r.profile?rangeStatus(r.qs,r.profile.qs):'')}${kpi('Q′w',fmt(r.qp,3),'mm³/(mm·s)',r.profile?rangeStatus(r.qp,r.profile.qp):'')}${kpi('Qw',fmt(r.Q,2),'mm³/s')}${kpi('h_eq',fmt(r.heq,6),'mm')}${kpi('Kontaktlänge l_g',fmt(r.lg,3),'mm')}</div>${r.profile?`<div class="callout">Interner First-Level-Zielbereich: q_s ${r.profile.qs[0]}–${r.profile.qs[1]}, Q′w ${r.profile.qp[0]}–${r.profile.qp[1]} mm³/(mm·s).</div>`:`<div class="status warn">Kein validierter Zielbereich hinterlegt. Werte werden berechnet, aber nicht automatisch bewertet.</div>`}`}if(id==='force'){const r=calcForce(state.setup,state.burn,state.force);errorBlock('forceErrors',r.errors);$('#forceResults').innerHTML=r.errors.length?'':`<div class="kpis">${kpi('Q′w',fmt(r.m.qp,3),'mm³/(mm·s)')}${kpi('Qw',fmt(r.m.Q,2),'mm³/s')}${kpi('Nettoleistung',range(r.power,2),'kW')}${kpi('F_t',range(r.ft,1),'N')}${kpi('F_n',range(r.fn,1),r.fnMeasured?'N · Messwert':'N · Modellwert')}${kpi('F_r',range(r.fr,1),'N')}${kpi('Drehmoment',range(r.t function renderFormulaList(l){$('#formulaResults').innerHTML=`<div class="cards">${l.map(f=>`<button class="info-card" data-formula-id="${f.id}"><span class="badge">${esc(f.cat)}</span><h4>${esc(f.name)}</h4><p>${esc(f.formula)}<br>${esc(f.unit)}</p></button>`).join('')}</div>`;$$('[data-formula-id]').forEach(b=>b.onclick=()=>showFormula(D.formulas.find(x=>x.id===b.dataset.formulaId)))}
