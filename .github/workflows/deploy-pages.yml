name: Deploy Schleifprozess Assistent

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate approved DE-EN knowledge version
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s ios-reset.html
          grep -qi '<!doctype html' index.html
          grep -qi '</html>' index.html
          grep -q '<title>Schleifprozess Assistent</title>' index.html
          test "$(stat -c%s index.html)" -eq 1145485
          test "$(sha256sum index.html | cut -d' ' -f1)" = "22e5cf076ceac8a89b45a3aa174824896c74320269f5f5ffba48876c39dabd4c"
          test "$(git hash-object index.html)" = "04b9ea4689f94bf2e5b3a6be0b2c4f41479ed76b"

      - name: Build GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp ios-reset.html _site/ios-reset.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
