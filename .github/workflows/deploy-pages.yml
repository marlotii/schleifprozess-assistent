name: Deploy Schleifprozess Assistent

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Schleifprozess Assistent 2.95 bereinigt
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s .nojekyll
          test -s assets/icon-192.png
          test -s assets/icon-512.png
          test -s assets/apple-touch-icon.png

          grep -qi '<!doctype html' index.html
          grep -qi '</html>' index.html
          grep -q '<title>Schleifprozess Assistent</title>' index.html
          grep -q 'id="v295-functional-fix-js"' index.html
          grep -q 'function parseNumber295' index.html
          ! grep -q 'mobile.css' index.html
          ! grep -q 'mobile-setup.js' index.html

          test "$(stat -c%s index.html)" -eq 918985
          test "$(sha256sum index.html | cut -d' ' -f1)" = "2aa683ef8de047fc6f56ba4cfd49bb9904d3622ec7064520a4bfb70070af53a9"
          test "$(git hash-object index.html)" = "d9d4bdc47f65e5c89b1beac1656225d97bd09011"

          sha256sum index.html manifest.webmanifest sw.js assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png > workflow-hashes.txt

      - name: Build GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js .nojekyll workflow-hashes.txt _site/
          cp assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png _site/assets/
          if [[ -f Schleifprozess_Assistent_3_0_VALIDATION.md ]]; then cp Schleifprozess_Assistent_3_0_VALIDATION.md _site/; fi
          if [[ -f Schleifprozess_Assistent_3_0_TESTLOG.txt ]]; then cp Schleifprozess_Assistent_3_0_TESTLOG.txt _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
