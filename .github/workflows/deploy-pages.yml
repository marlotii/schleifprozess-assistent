name: Deploy Schleifprozess Assistent

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate source and build Pages folder
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s source-original.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s mobile.css
          test -s assets/icon-192.png
          test -s assets/icon-512.png
          test -s assets/apple-touch-icon.png
          grep -qi '<!doctype html' index.html
          grep -qi '</html>' index.html
          grep -qi 'manifest.webmanifest' index.html
          grep -qi 'serviceWorker.register' index.html
          sha256sum source-original.html index.html manifest.webmanifest sw.js mobile.css > workflow-hashes.txt
          rm -rf _site
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js mobile.css .nojekyll _site/
          cp assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png _site/assets/
          cp workflow-hashes.txt _site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="./mobile.css">'
          if marker not in html:
              if '</head>' not in html:
                  raise SystemExit('Missing </head> in index.html')
              html = html.replace('</head>', marker + '\n</head>', 1)
          image_key_fixes = {
              "'heat_damage'": "'heat_clean'",
              "'grain_compare'": "'wheel_clean'",
              "'wheel_composition'": "'wheel_clean'",
              "'qs_visual'": "'qs_clean'",
          }
          for old, new in image_key_fixes.items():
              html = html.replace(old, new)
          p.write_text(html, encoding='utf-8')
          PY
          grep -q 'mobile.css' _site/index.html
          ! grep -q "'heat_damage'" _site/index.html
          ! grep -q "'grain_compare'" _site/index.html
          ! grep -q "'wheel_composition'" _site/index.html
          ! grep -q "'qs_visual'" _site/index.html
          test "$(stat -c%s _site/index.html)" -gt 800000

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
