name: Deploy Schleifprozess Assistent

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Schleifprozess Assistent 3.0
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s .nojekyll
          test -s assets/icon-192.png
          test -s assets/icon-512.png
          test -s assets/apple-touch-icon.png

          grep -qi '<!doctype html' index.html
          grep -qi '</html>' index.html
          grep -q '<title>Schleifprozess Assistent 3.0</title>' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'serviceWorker.register' index.html
          ! grep -q 'mobile.css' index.html
          ! grep -q 'mobile-setup.js' index.html

          test "$(stat -c%s index.html)" -eq 536911
          test "$(sha256sum index.html | cut -d' ' -f1)" = "08445ee17e50925a25b3e7f41a67692d67dfff060478d775144d6e297bc2637d"
          test "$(git hash-object index.html)" = "98172e2ec2a1df81a805f54fb2131bab5c584e63"

          sha256sum index.html manifest.webmanifest sw.js assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png > workflow-hashes.txt

      - name: Build GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js .nojekyll workflow-hashes.txt _site/
          cp assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png _site/assets/
          if [[ -f Schleifprozess_Assistent_3_0_VALIDATION.md ]]; then cp Schleifprozess_Assistent_3_0_VALIDATION.md _site/; fi
          if [[ -f Schleifprozess_Assistent_3_0_TESTLOG.txt ]]; then cp Schleifprozess_Assistent_3_0_TESTLOG.txt _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
