name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            source-original.html index.html manifest.webmanifest sw.js .nojekyll
            README.md README-OFFLINE.txt SOURCE_HASHES.txt TECHNICAL_ANALYSIS.md VALIDATION.txt
            assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png
          )
          for file in "${required[@]}"; do test -f "$file"; done
          test "$(sha256sum source-original.html | cut -d' ' -f1)" = "f4848dbd5c9a0357c0dc77b61149fa4df3b4ba1a466aa093cf3b415ffdf7adfe"
          grep -qi '^<!doctype html>' index.html
          grep -qi '</html>[[:space:]]*$' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'serviceWorker.register' index.html
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          python3 - <<'PYVALID'
          from pathlib import Path
          import struct
          expected={
              'assets/icon-192.png': (192,192),
              'assets/icon-512.png': (512,512),
              'assets/apple-touch-icon.png': (180,180),
          }
          for name,dims in expected.items():
              data=Path(name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==dims,(name,width,height)
          PYVALID

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png _site/assets/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
