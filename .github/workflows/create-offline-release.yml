name: Create Offline Release

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0
      RELEASE_TITLE: Schleifprozess Assistent v1.0.0
      ZIP_NAME: Schleifprozess_Assistent_Offline_v1.0.0.zip
      PACKAGE_DIR: Schleifprozess_Assistent_Offline_v1.0.0
    steps:
      - name: Resolve deployed commit
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Refuse to overwrite an existing release or tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Validate and build Windows offline ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f source-original.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f README-OFFLINE.txt
          test -f assets/icon-192.png
          test -f assets/icon-512.png
          test -f assets/apple-touch-icon.png
          rm -rf "$PACKAGE_DIR" "$ZIP_NAME"
          mkdir -p "$PACKAGE_DIR/assets"
          cp source-original.html "$PACKAGE_DIR/index.html"
          cp manifest.webmanifest sw.js README-OFFLINE.txt "$PACKAGE_DIR/"
          cp assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png "$PACKAGE_DIR/assets/"
          (
            cd "$PACKAGE_DIR"
            sha256sum index.html manifest.webmanifest sw.js README-OFFLINE.txt               assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png > SHA256SUMS.txt
          )
          zip -r -9 "$ZIP_NAME" "$PACKAGE_DIR"
          unzip -t "$ZIP_NAME"
          unzip -p "$ZIP_NAME" "$PACKAGE_DIR/index.html" | grep -qi '^<!doctype html>'
          test -s "$ZIP_NAME"

      - name: Create immutable v1.0.0 release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$ZIP_NAME"             --target "${{ steps.ref.outputs.sha }}"             --title "$RELEASE_TITLE"             --notes "Validated GitHub Pages deployment and Windows offline package. The offline index.html is the unchanged supplied original application."
