name: Create Offline Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, beispielsweise v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows offline package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="Schleifprozess_Assistent_Offline_${VERSION}"
          rm -rf "$PACKAGE" "$PACKAGE.zip"
          mkdir -p "$PACKAGE/assets"
          cp source-original.html "$PACKAGE/index.html"
          cp manifest.webmanifest sw.js README-OFFLINE.txt "$PACKAGE/"
          cp assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png "$PACKAGE/assets/"
          sha256sum "$PACKAGE/index.html" "$PACKAGE/manifest.webmanifest" "$PACKAGE/sw.js" "$PACKAGE/assets/"*.png > "$PACKAGE/SHA256SUMS.txt"
          grep -qi '<!doctype html' "$PACKAGE/index.html"
          grep -qi '</html>' "$PACKAGE/index.html"
          zip -r "$PACKAGE.zip" "$PACKAGE"
          test -s "$PACKAGE.zip"
          echo "PACKAGE_FILE=$PACKAGE.zip" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$VERSION" "$PACKAGE_FILE" --title "Schleifprozess Assistent $VERSION" --notes "Automatisch erzeugte Windows-Offline-Version. ZIP vollständig entpacken und index.html öffnen."
